<body>
    <h1>Formulário de Cadastro</h1>
    <div id="box-form">

    <p class="descricao">Preencha o formulário abaixo para criar sua conta:</p>
    <form action="/submit" method="post">
        <label for="name">Nome:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Senha:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <label for="data_de_nascimento">Data de Nascimento:</label><br>
        <input type="date" id="data_de_nascimento" name="data_de_nascimento" required><br><br>

        <label for="curso">Curso:</label><br>
        <select id="curso" name="curso" required>
            <option value="">Selecione um curso</option>
            <option value="informatica">Informática</option>
            <option value="administracao">Administração</option>
            <option value="enfermagem">Enfermagem</option>
            <option value="direito">Direito</option>
        </select><br><br>

        <label for="sexo">Sexo:</label><br>
        <select id="sexo" name="sexo" required>
            <option value="">Selecione o sexo</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
        </select><br><br>

        <div id="interesses">
        <label for="interesses">Interesse de cadastro:</label><br>
        <input type="checkbox" id="interesse1" name="interesses" value="tecnologia">
        <label for="interesse1">Tecnologia</label><br>
        <input type="checkbox" id="interesse2" name="interesses" value="esportes">
        <label for="interesse2">Esportes</label><br>
        <input type="checkbox" id="interesse3" name="interesses" value="musica">
        <label for="interesse3">Música</label><br>
        </div>

        <label for="comentarios">Comentários:</label><br>
        <textarea id="comentarios" name="comentarios" rows="2" cols="40"></textarea><br><br>

        <label for="upload">Upload de foto:</label><br>
        <input type="file" id="upload" name="upload"><br><br>

        <input type="submit" value="Cadastrar">
    </form>
    </div>
</body>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #46448d;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #fff;
        margin-bottom: 20px;
        text-align: center;
    }

    form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 600px;
        margin: 0 auto;
    }

    form input:invalid:focus,
    form select:invalid:focus,
    form textarea:invalid:focus {
        border-color: red;
    }

    .descricao {
        color: #030303;
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 5px darkgray solid;
        border-radius: 10px;
    }

    #box-form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 800px;
        margin: 40px auto;
        text-align: left;

    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select,
    textarea:focus,
    input[type="file"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        
    }

    input[type="submit"] {
        background-color: #46448d;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #030246;
    }

    #interesses {
        margin-bottom: 10px;
        padding: 10px;
    }

    #interesses input[type="checkbox"] {
        margin-right: 5px;
        text-align: left;
    }

    #comentarios {
        resize: none;
    }
    #upload {
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    #upload:hover {
        border-color: #46448d;
    }

</style>
